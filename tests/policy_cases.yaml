# SCP・RCP で拒否されるかのテストケース（scripts/test_policy_cases.py が使う）。
# デモ1〜3と同じ操作に、例外の管理者ロールとルートの場合を足した。
#
# expect: deny  … SCP か RCP で拒否される（by があれば、その文が拒否していること）
# expect: allow … SCP・RCP では拒否されない（IAM の権限はある前提）
# 書いていない項目は defaults の値になる。

vars: # ポリシーの ${...} に入れる値（Terraform の変数と同じ名前）
  primary_region: ap-northeast-1
  secondary_region: ap-northeast-3
  admin_role_name: OrganizationAccountAccessRole
  log_bucket_name: guardrails-logs-test

principals: # 誰として操作するか（aws:PrincipalArn）
  sso_admin: arn:aws:iam::222222222222:role/aws-reserved/sso.amazonaws.com/ap-northeast-1/AWSReservedSSO_GuardrailsAdmin_0123456789abcdef
  admin_role: arn:aws:iam::222222222222:role/OrganizationAccountAccessRole
  root: arn:aws:iam::222222222222:root

defaults:
  principal: sso_admin # Identity Center の管理者（AdministratorAccess）。デモはこれで実行する
  region: ap-northeast-1
  resource: "*"
  secure_transport: true

cases:
  # ---- デモ1（C01）：リージョン
  - { name: 東京で VPC の一覧, action: ec2:DescribeVpcs, expect: allow }
  - { name: us-east-1 で VPC の一覧, action: ec2:DescribeVpcs, region: us-east-1, expect: deny, by: C01DenyOutsideAllowedRegions }
  - { name: eu-west-1 で VPC の一覧, action: ec2:DescribeVpcs, region: eu-west-1, expect: deny, by: C01DenyOutsideAllowedRegions }
  - { name: グローバルサービス（IAM）は us-east-1 でも使える, action: iam:ListAccountAliases, region: us-east-1, expect: allow }
  - { name: 大阪で VPC の一覧, action: ec2:DescribeVpcs, region: ap-northeast-3, expect: deny, by: C01DenyOsakaExceptBedrock }
  - { name: 大阪で Bedrock の推論, action: bedrock:InvokeModel, region: ap-northeast-3, expect: allow }
  - { name: 大阪でも Bedrock のモデル一覧は使えない, action: bedrock:ListFoundationModels, region: ap-northeast-3, expect: deny, by: C01DenyOsakaExceptBedrock }
  - { name: us-east-1 では Bedrock の推論も使えない, action: bedrock:InvokeModel, region: us-east-1, expect: deny, by: C01DenyOutsideAllowedRegions }
  - { name: リージョン制限には管理者ロールの例外もない, action: ec2:DescribeVpcs, region: us-east-1, principal: admin_role, expect: deny, by: C01DenyOutsideAllowedRegions }

  # ---- デモ2（C02・C03）：ログと構成の記録
  - { name: Config の記録を止める, action: config:StopConfigurationRecorder, expect: deny, by: C03DenyConfigChanges }
  - { name: Config のルールを消す, action: config:DeleteConfigRule, expect: deny, by: C03DenyConfigChanges }
  - { name: CloudTrail を止める, action: cloudtrail:StopLogging, expect: deny, by: C02DenyCloudTrailChanges }
  - { name: ログを消す, action: s3:DeleteObject, resource: "arn:aws:s3:::guardrails-logs-test/AWSLogs/o-test/x.json.gz", expect: deny, by: C02ProtectLogBucket }
  - { name: ログバケットのバージョニングを変える, action: s3:PutBucketVersioning, resource: "arn:aws:s3:::guardrails-logs-test", expect: deny, by: C02ProtectLogBucket }
  - { name: ほかのバケットの中身は消せる, action: s3:DeleteObject, resource: "arn:aws:s3:::other-bucket/x", expect: allow }
  - { name: 管理者ロールは Config を変えられる（例外）, action: config:StopConfigurationRecorder, principal: admin_role, expect: allow }

  # ---- デモ3（C04〜C07、C09）：アカウントの基本設定
  - { name: EBS の既定の暗号化を切る, action: ec2:DisableEbsEncryptionByDefault, expect: deny, by: C04DenyDisableEbsDefaultEncryption }
  - { name: S3 のパブリックアクセスブロックを変える, action: s3:PutAccountPublicAccessBlock, expect: deny, by: C05DenyAccountPublicAccessBlockChange }
  - { name: HTTPS で一覧を取る, action: s3:ListBucket, resource: "arn:aws:s3:::guardrails-logs-test", expect: allow }
  - { name: HTTP で一覧を取る, action: s3:ListBucket, resource: "arn:aws:s3:::guardrails-logs-test", secure_transport: false, expect: deny, by: C06DenyS3WithoutTLS }
  - { name: IAM ユーザーを作る, action: iam:CreateUser, expect: deny, by: C07DenyLongTermCredentials }
  - { name: アクセスキーを作る, action: iam:CreateAccessKey, expect: deny, by: C07DenyLongTermCredentials }
  - { name: 管理者ロールは IAM ユーザーを作れる（例外）, action: iam:CreateUser, principal: admin_role, expect: allow }
  - { name: ルートは何もできない, action: s3:ListAllMyBuckets, principal: root, expect: deny, by: C09DenyRootUser }
